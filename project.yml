name: VSLight
options:
  bundleIdPrefix: com.bhs
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  VSLight:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: VSLight
        PRODUCT_BUNDLE_IDENTIFIER: com.bhs.vslight
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Copy Audio Driver
        basedOnDependencyAnalysis: false
        script: |
          DRIVER="${SRCROOT}/Driver/build/VSLightAudioDriver.driver"
          if [ -d "$DRIVER" ]; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/VSLightAudioDriver.driver"
            rm -rf "$DEST"
            cp -R "$DRIVER" "$DEST"
          fi
  VSLightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VSLight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhs.vslight.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VSLight.app/Contents/MacOS/VSLight"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VSLight:
    build:
      targets:
        VSLight: all
        VSLightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VSLightTests
    archive:
      config: Release
