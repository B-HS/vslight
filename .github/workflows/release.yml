name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Draft Release
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          BUMP="${{ inputs.version_bump || 'patch' }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')"
          else
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$LATEST" ]; then
              MAJOR=0
              MINOR=1
              PATCH=0
              PREVIOUS=""
            else
              MAJOR="$(echo "$LATEST" | sed -E 's/^v([0-9]+)\..*/\1/')"
              MINOR="$(echo "$LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')"
              PATCH="$(echo "$LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')"
              PREVIOUS="$LATEST"
              case "$BUMP" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  while case "$MAJOR" in *4*) true;; *) false;; esac; do MAJOR=$((MAJOR + 1)); done
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  while case "$MAJOR.$MINOR.$PATCH" in *4*) true;; *) false;; esac; do
                    MINOR=$((MINOR + 1))
                  done
                  ;;
                *)
                  PATCH=$((PATCH + 1))
                  while case "$PATCH" in *4*) true;; *) false;; esac; do PATCH=$((PATCH + 1)); done
                  ;;
              esac
            fi
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          case "$VERSION" in
            *4*)
              echo "::error::Version $VERSION contains the forbidden digit 4."
              exit 1
              ;;
          esac

          BUILD="$GITHUB_RUN_NUMBER"
          while case "$BUILD" in *4*) true;; *) false;; esac; do BUILD=$((BUILD + 1)); done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Computed v$VERSION ($BUILD), previous: ${PREVIOUS:-none}"

      - name: Test
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project VSLight.xcodeproj -scheme VSLight \
            -configuration Debug -derivedDataPath build \
            -destination 'platform=macOS' test

      - name: Import signing certificate
        id: sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-tmp-keychain
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret set; the app will be ad-hoc signed."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -P "$CERT_PATH" 2>/dev/null || rm -f "$CERT_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build audio driver
        env:
          CODESIGN_ID: ${{ steps.sign.outputs.identity }}
        run: ./Scripts/build-driver.sh

      - name: Build release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project VSLight.xcodeproj -scheme VSLight \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Sign app
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          APP="build/Build/Products/Release/VSLight.app"
          if [ -n "$IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp \
              --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "Notarization skipped (missing Developer ID certificate or Apple credentials)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          xcrun notarytool store-credentials "vslight-ci" \
            --keychain "$KEYCHAIN" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          APP="build/Build/Products/Release/VSLight.app"
          ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          RESULT=$(xcrun notarytool submit "$ZIP" \
            --keychain "$KEYCHAIN" --keychain-profile "vslight-ci" \
            --wait --output-format json)
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | plutil -extract status raw -o - - 2>/dev/null || echo "")
          SUB_ID=$(echo "$RESULT" | plutil -extract id raw -o - - 2>/dev/null || echo "")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS"
            [ -n "$SUB_ID" ] && xcrun notarytool log "$SUB_ID" \
              --keychain "$KEYCHAIN" --keychain-profile "vslight-ci" || true
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Package zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent "VSLight.app" "VSLight-$VERSION.zip"
          shasum -a 256 "VSLight-$VERSION.zip" > "VSLight-$VERSION.zip.sha256"

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          if [ -z "$PREVIOUS" ]; then
            LOG="$(git log --pretty=format:'- %s (%h)' --reverse)"
          else
            LOG="$(git log "$PREVIOUS"..HEAD --pretty=format:'- %s (%h)' --reverse)"
          fi
          SIGNED_NOTE="ad-hoc signed"
          if [ -n "${{ steps.sign.outputs.identity }}" ]; then
            SIGNED_NOTE="Developer ID signed and notarized"
          fi
          {
            echo "body<<EOF"
            echo "### Changes"
            echo ""
            echo "$LOG"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- \`VSLight-$VERSION.zip\` — $SIGNED_NOTE"
            echo "- \`.sha256\` — checksum"
            echo ""
            echo "> Draft release. Test the app before publishing."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: VSLight v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          prerelease: false
          files: |
            build/Build/Products/Release/VSLight-${{ steps.version.outputs.version }}.zip
            build/Build/Products/Release/VSLight-${{ steps.version.outputs.version }}.zip.sha256

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -Pf "$RUNNER_TEMP/build_certificate.p12" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notarize.zip" 2>/dev/null || true
